name: Check public packages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test --workspace=@scape-wtf/sdk
      - run: npm test --workspace=@scape-wtf/cli
      - run: npm test --workspace=@scape-wtf/agent-mcp
